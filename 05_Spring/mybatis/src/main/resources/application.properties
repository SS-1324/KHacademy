spring.application.name=mybatis

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# DB접속정보 JDBC
spring.datasource.url=jdbc:mysql://localhost:3306/back_tdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=server
spring.datasource.password=server
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#My Batis 설정
# XML에서 패키지 경로 없이 클래스명만 입력해서 쓸 수 있게 별칭 등록
mybatis.type-aliases-package=com.kh.mybatis.dto
#XML Mapper 파일들이 위치한 경로 (resources/mappers 하위 모든 xml)
mybatis.mapper-locations=classpath:mappers/**/*.xml